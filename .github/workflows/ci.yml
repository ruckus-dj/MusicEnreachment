name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.2
          args: --help
      - run: bun install --cwd frontend --frozen-lockfile
      - run: scripts/verify.sh
