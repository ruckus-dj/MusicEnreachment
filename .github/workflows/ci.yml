name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  publish:
    name: Publish container image
    if: github.event_name == 'push'
    needs: [verify, platforms, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check release tag belongs to main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=dev-,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - name: Install PostgreSQL runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libssl3t64 \
            libreadline8t64 \
            libxml2 \
            libgssapi-krb5-2 \
            zlib1g \
            liblz4-1 \
            libzstd1
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --help
      - run: task verify

  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - name: Install PostgreSQL runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libssl3t64 \
            libreadline8t64 \
            libxml2 \
            libgssapi-krb5-2 \
            zlib1g \
            liblz4-1 \
            libzstd1
      - name: Install Windows C++ toolchain
        id: windows-cxx
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Add Windows C++ tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Join-Path '${{ steps.windows-cxx.outputs.msys2-location }}' 'mingw64\bin' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # The embedded PostgreSQL 18 provider makes the full integration suite
      # available on every native platform in this matrix.
      - name: Test backend integration suite
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        # Each test package starts a native PostgreSQL server. Limit concurrent
        # servers on Windows while retaining parallel tests within each package.
        if: runner.os == 'Windows'
        run: task ci:windows-tests
      - name: Test backend integration suite (non-Windows)
        if: runner.os != 'Windows'
        working-directory: backend
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        run: go test -tags=integration -count=1 -p 8 -parallel 8 ./...
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Stage frontend assets
        run: node tools/stage-frontend.mjs
      - name: Prepare backend output
        run: node tools/prepare-build.mjs
      - name: Build backend
        working-directory: backend
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        run: go build -o ../build/backend/ ./cmd/server
      - name: Verify Windows binary has no MinGW runtime DLL dependencies
        if: runner.os == 'Windows'
        working-directory: backend
        shell: pwsh
        run: |
          $output = & objdump -p ../build/backend/server.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect Windows backend imports with objdump"
          }
          $imports = $output -join "`n"
          if ($imports -match '(?i)DLL Name:\s*(libstdc\+\+-6|libgcc_s_.*|libwinpthread-1)\.dll') {
            throw "Windows backend depends on a MinGW runtime DLL: $matches"
          }

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify the deployment
        env:
          APP_PORT: "18080"
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/compose/docker-compose.yml)
          cleanup() {
            "${compose[@]}" logs --no-color || true
            "${compose[@]}" down --volumes || true
          }
          trap cleanup EXIT

          "${compose[@]}" up --detach --build --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:18080/health/live |
            grep --fixed-strings '"status":"live"'
          curl --fail --silent --show-error http://127.0.0.1:18080/health/ready |
            grep --fixed-strings '"status":"ready"'

          index=$(curl --fail --silent --show-error http://127.0.0.1:18080/)
          asset=$(printf '%s' "$index" | sed -n 's/.*src="\([^\"]*\/assets\/[^\"]*\.js\)".*/\1/p')
          test -n "$asset"
          curl --fail --silent --show-error --head "http://127.0.0.1:18080$asset" |
            grep --ignore-case --fixed-strings 'cache-control: public, max-age=31536000, immutable'

          settings_status=$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request PUT "http://127.0.0.1:${APP_PORT}/api/setup/runtime" \
            --header 'content-type: application/json' \
            --data '{"tools_directory":"/var/lib/melotrove/tools","output_directory":"/var/lib/melotrove/output","publication_format":"mka"}')
          test "$settings_status" = "204"

          "${compose[@]}" up --detach --force-recreate app
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${APP_PORT}/health/ready" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl --fail --silent --show-error "http://127.0.0.1:${APP_PORT}/api/setup" |
            grep --fixed-strings '"publication_format":"mka"'

          container=$("${compose[@]}" ps --quiet app)
          "${compose[@]}" stop --timeout 15 app
          test "$(docker inspect "$container" --format '{{.State.ExitCode}}')" = "0"
