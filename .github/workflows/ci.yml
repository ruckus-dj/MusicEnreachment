name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Check frontend formatting and lint
        run: npm run check --prefix frontend

      - name: Run frontend unit tests
        run: npm run test --prefix frontend

  checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check src tests alembic

      - name: Check formatting
        run: uv run ruff format --check src tests alembic

      - name: Check types
        run: uv run ty check src

  postgres:
    name: PostgreSQL contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools

      - name: Install dependencies
        run: uv sync --locked

      - name: Build runtime image
        run: docker build -t music-enrichment-test-stand-music-ingest:latest .

      - name: Run PostgreSQL contracts
        run: MUSIC_INGEST_ENABLE_POSTGRES_TESTS=1 uv run pytest -m postgres

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Start fixture-backed application
        run: docker compose -f test_stand/compose.yaml up --build --wait music-ingest

      - name: Run operator smoke tests
        run: MUSIC_INGEST_E2E_BASE_URL=http://127.0.0.1:8787 npm run test:e2e --prefix frontend

      - name: Stop fixture-backed application
        if: always()
        run: docker compose -f test_stand/compose.yaml down

  image:
    name: Container image
    needs: [frontend, checks, postgres, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
