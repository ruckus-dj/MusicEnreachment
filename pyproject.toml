[project]
name = "musicenreachment"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.140.7",
    "httpx2==2.10.0",
    "sqlalchemy==2.0.51",
    "requests==2.34.2",
    "alembic>=1.18.0",
    "pydantic>=2.12.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ty>=0.0.59",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["**/__pycache__", "**/.venv", "**/.git", "**/.codegraph"]

[tool.basedpyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "live: requires explicit MUSIC_INGEST_ENABLE_LIVE_TESTS=1 opt-in",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
