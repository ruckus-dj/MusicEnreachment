[project]
name = "musicenreachment"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "sqlalchemy==2.0.52",
    "requests==2.34.2",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "mutagen==1.48.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "uvicorn>=0.35.0",
    "rapidfuzz>=3.14.6",
    "Unidecode==1.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.16.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.80",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["**/__pycache__", "**/.venv", "**/.git", "**/.codegraph"]

[tool.basedpyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-m", "not postgres"]
markers = [
    "postgres: requires explicit MUSIC_INGEST_ENABLE_POSTGRES_TESTS=1 opt-in",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
