<!doctype html>
<html

	data-theme="light"

	[--button-text:#fff] [--warning:#845a12] [--warning-soft:#fff2d7] [--error:#a13535]
	[--error-soft:#fde9e8] [--info:#315f88] [--info-soft:#e7f0fa] [--success:var(--accent)]
	[--success-soft:var(--accent-soft)] [--focus:var(--accent)] [--button:var(--accent)] [--radius:5px]
	[--control-radius:4px] [--mono:ui-monospace,SFMono-Regular,Consolas,monospace]

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Медиатека · стенд MeloTrove</title>
  </head>
  <body class="m-0 min-h-dvh bg-[var(--canvas)] font-[system-ui,sans-serif] text-[13px]/[1.4] text-[var(--ink)]
    [&_*:focus-visible]:outline-2 [&_*:focus-visible]:outline-[var(--focus)]
    [&_*:focus-visible]:outline-offset-2 motion-reduce:[&_*]:transition-none motion-reduce:[&_*::before]:transition-none motion-reduce:[&_*::after]:transition-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
