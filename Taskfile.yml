version: "3"

tasks:
  default:
    desc: Build the complete application
    cmds:
      - task: build

  frontend:install:
    desc: Install locked frontend dependencies
    sources:
      - frontend/package.json
      - frontend/package-lock.json
    cmds:
      - npm --prefix frontend ci

  frontend:build:
    desc: Build the Vite frontend into build/frontend
    deps: [frontend:install]
    cmds:
      - npm --prefix frontend run build

  frontend:stage:
    desc: Stage frontend assets for Go embed
    deps: [frontend:build]
    cmds:
      - node tools/stage-frontend.mjs

  generate:
    desc: Generate OpenAPI and Orval client code
    deps: [frontend:install]
    cmds:
      - task: go:openapi
      - npm --prefix frontend run generate

  go:openapi:
    internal: true
    dir: backend
    cmds:
      - go run ./cmd/openapi -output ../frontend/openapi.json

  build:
    desc: Build frontend and embedded Go application into build/
    deps: [frontend:stage]
    cmds:
      - node tools/prepare-build.mjs
      - task: go:build

  run:
    desc: Build and run the application with PostgreSQL via Docker Compose in the background
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml up --build --detach

  stop:
    desc: Stop the application Docker Compose services
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml stop

  go:build:
    internal: true
    dir: backend
    cmds:
      - go build -o ../build/backend/ ./cmd/server

  test:
    desc: Run backend, frontend, and tools tests concurrently
    deps: [go:test, frontend:test, tools:test]

  frontend:test:
    internal: true
    deps: [frontend:install]
    cmds:
      - npm --prefix frontend run test

  tools:test:
    internal: true
    cmds:
      - node --test tools/check-generated.test.mjs

  migrate:rollback:
    desc: Roll back the last application migration group (stop the server first)
    dir: backend
    cmds:
      - go run ./cmd/migrate -rollback

  go:test:
    internal: true
    dir: backend
    cmds:
      - go test -tags=integration -count=1 -p 8 -parallel 8 ./...

  format:
    desc: Apply Go and frontend formatting
    deps: [frontend:install]
    cmds:
      - gofmt -w backend
      - npm --prefix frontend run format

  lint:
    desc: Run Go and frontend linters
    deps: [frontend:install]
    cmds:
      - node tools/check-gofmt.mjs
      - task: go:lint
      - npm --prefix frontend run lint

  go:lint:
    internal: true
    dir: backend
    cmds:
      - golangci-lint run ./...

  fixtures:provision:
    desc: Manual online acceptance (not an automated CI gate) - download approved managed FFmpeg binaries over the network and generate a seek-dependent transport fixture
    vars:
      RELEASE: '{{.RELEASE | default "latest"}}'
      OUTPUT: '{{.OUTPUT | default "build/tool-fixtures"}}'
      MANIFEST: '{{.MANIFEST | default "build/tool-fixtures/manifest.json"}}'
    dir: backend
    cmds:
      - go run ./cmd/tool-fixtures -release "{{.RELEASE}}" -output "{{if isAbs .OUTPUT}}{{.OUTPUT}}{{else}}{{joinPath .ROOT_DIR .OUTPUT}}{{end}}" -manifest "{{if isAbs .MANIFEST}}{{.MANIFEST}}{{else}}{{joinPath .ROOT_DIR .MANIFEST}}{{end}}"

  fixtures:managed-transport:
    desc: Manual online acceptance (not an automated CI gate) - provision the fixture over the network then run managed-transport-tagged tools tests against its manifest
    deps: [fixtures:provision]
    vars:
      MANIFEST: '{{.MANIFEST | default "build/tool-fixtures/manifest.json"}}'
    dir: backend
    cmds:
      - go test -tags=managed_transport ./internal/integrations/tools -args -managed-manifest "{{if isAbs .MANIFEST}}{{.MANIFEST}}{{else}}{{joinPath .ROOT_DIR .MANIFEST}}{{end}}"

  verify:
    desc: Run generation, linting, tests, and build
    cmds:
      - task: generate
      - node tools/check-generated.mjs
      - task: lint
      - task: test
      - task: build
