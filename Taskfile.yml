version: "3"

env:
  CGO_ENABLED: "1"

tasks:
  design:install:
    desc: Install standalone React design dependencies
    sources:
      - docs/app-design-react/package.json
      - docs/app-design-react/package-lock.json
    cmds:
      - npm --prefix docs/app-design-react ci --ignore-scripts

  design:run:
    desc: Serve the separate React design prototype
    deps: [design:install]
    dir: docs/app-design-react
    cmds:
      - node_modules/.bin/vite --host 127.0.0.1 --port 5175

  design:check:
    desc: Validate canonical fixtures and check the separate React design prototype
    deps: [design:install]
    dir: docs/app-design-react
    cmds:
      - node check-fixtures.mjs
      - node --test check-fixtures.test.mjs
      - node_modules/.bin/biome check .
      - node_modules/.bin/tsc --project tsconfig.json
      - node_modules/.bin/vitest run
      - node_modules/.bin/vite build

  default:
    desc: Build the complete application
    cmds:
      - task: build

  frontend:install:
    desc: Install locked frontend dependencies
    sources:
      - frontend/package.json
      - frontend/package-lock.json
    cmds:
      - npm --prefix frontend ci

  frontend:build:
    desc: Build the Vite frontend into build/frontend
    deps: [frontend:install]
    cmds:
      - npm --prefix frontend run build

  frontend:stage:
    desc: Stage frontend assets for Go embed
    deps: [frontend:build]
    cmds:
      - node tools/stage-frontend.mjs

  generate:
    desc: Generate operation-kind ordering, OpenAPI and Orval client code
    deps: [frontend:install]
    cmds:
      - node tools/generate-operation-kind-order.mjs
      - task: go:openapi
      - npm --prefix frontend run generate

  go:openapi:
    internal: true
    dir: backend
    cmds:
      - go run ./cmd/openapi -output ../frontend/openapi.json

  matching:experiment:
    desc: Replay read-only matching experiments from a frozen JSON fixture
    dir: backend
    cmds:
      - go run ./cmd/matching-experiment {{.CLI_ARGS}}

  build:
    desc: Build frontend and embedded Go application into build/
    deps: [frontend:stage]
    cmds:
      - node tools/prepare-build.mjs
      - task: go:build

  run:
    desc: Build and run the application with PostgreSQL via Docker Compose in the background
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml up --build --detach

  stop:
    desc: Stop the application Docker Compose services
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml stop

  stand:up:
    desc: Build and start the local test stand (app, PostgreSQL, Navidrome, Feishin), waiting for healthy
    cmds:
      - docker compose -p melotrove-go-test-stand -f test_stand/compose.yaml up --build --detach --wait --wait-timeout 240

  stand:down:
    desc: Stop and remove the local test stand containers and network (volumes are kept)
    cmds:
      - docker compose -p melotrove-go-test-stand -f test_stand/compose.yaml down

  stand:reset:
    desc: Permanently reset test stand PostgreSQL, Navidrome, stage, output and tools (keeps downloads)
    cmds:
      - |
        set -eu
        for dir in test_stand test_stand/data test_stand/config test_stand/data/downloads \
          test_stand/data/stage test_stand/data/media-go test_stand/data/tools test_stand/config/navidrome-go
        do
          if test -L "$dir"; then
            printf 'Refusing to reset with a symlink at %s\n' "$dir" >&2
            exit 1
          fi
        done
        project=melotrove-go-test-stand
        containers=$(docker ps -aq --filter "label=com.docker.compose.project=$project")
        for id in $containers; do
          stand_dir=$(docker inspect --format '{{"{{"}}index .Config.Labels "com.docker.compose.project.working_dir"{{"}}"}}' "$id")
          if test "$stand_dir" != "$(pwd -P)/test_stand"; then
            printf 'Refusing to reset project %s from a different checkout\n' "$project" >&2
            exit 1
          fi
        done
        docker compose -p "$project" -f test_stand/compose.yaml down
        rm -rf -- test_stand/data/stage test_stand/data/media-go test_stand/data/tools test_stand/config/navidrome-go
        mkdir -p -- test_stand/data/stage test_stand/data/media-go test_stand/data/tools test_stand/config/navidrome-go
        docker compose -p "$project" -f test_stand/compose.yaml down --volumes

  stand:logs:
    desc: Follow the local test stand logs from the last 100 lines
    cmds:
      - docker compose -p melotrove-go-test-stand -f test_stand/compose.yaml logs --follow --tail 100

  go:build:
    internal: true
    dir: backend
    cmds:
      - go build -o ../build/backend/ ./cmd/server

  test:
    desc: Run test suites without oversubscribing backend and browser workers
    cmds:
      - task: go:test
      - task: frontend:test
      - task: tools:test

  frontend:test:
    internal: true
    deps: [frontend:install]
    cmds:
      - npm --prefix frontend run test

  tools:test:
    internal: true
    deps: [frontend:install]
    cmds:
      # Node 24 expands tools/*.test.mjs itself, so colocated tool tests are picked up
      # without shell globbing (works on Windows shells that do not expand globs).
      - node --test tools/*.test.mjs

  migrate:rollback:
    desc: Roll back the last application migration group (stop the server first)
    dir: backend
    cmds:
      - go run ./cmd/migrate -rollback

  go:test:
    internal: true
    dir: backend
    cmds:
      - node ../tools/run-go-tests.mjs

  ci:windows-tests:
    desc: Run Windows CI backend tests with the persistence package split into two deterministic shards
    dir: backend
    cmds:
      - node ../tools/windows-persistence-shards.mjs

  native:windows-vips:
    desc: Build pinned native Windows image libraries for CI
    cmds:
      - node tools/prepare-windows-vips.mjs

  native:windows-postgres-diagnostics:
    desc: Build the pinned, instrumented Windows PostgreSQL supervisor for manual CI diagnostics
    env:
      CGO_ENABLED: "0"
    cmds:
      - node tools/prepare-windows-postgres-diagnostics.mjs

  format:
    desc: Apply Go and frontend formatting
    deps: [frontend:install]
    cmds:
      - gofmt -w backend
      - npm --prefix frontend run format

  lint:
    desc: Run Go and frontend linters
    deps: [frontend:install]
    cmds:
      - node tools/check-gofmt.mjs
      - task: go:lint
      - npm --prefix frontend run lint

  go:lint:
    internal: true
    dir: backend
    cmds:
      - golangci-lint run ./...

  check:unused:
    desc: Report unused Go functions, Go declarations, and frontend files/exports/types (not part of verify)
    cmds:
      - task: check:unused:deadcode
      - task: check:unused:go-lint
      - task: check:unused:knip

  check:unused:deadcode:
    internal: true
    dir: backend
    cmds:
      - go run golang.org/x/tools/cmd/deadcode@v0.53.0 -test=false ./cmd/server ./internal/...

  check:unused:go-lint:
    internal: true
    dir: backend
    cmds:
      - golangci-lint run --default=none -E unused --tests=false --issues-exit-code=0 --max-issues-per-linter=0 --max-same-issues=0 ./cmd/server ./internal/...

  check:unused:knip:
    internal: true
    deps: [frontend:install]
    cmds:
      - npm --prefix frontend run unused

  fixtures:provision:
    desc: Manual online acceptance (not an automated CI gate) - download approved managed FFmpeg binaries over the network and generate a seek-dependent transport fixture
    vars:
      RELEASE: '{{.RELEASE | default "latest"}}'
      OUTPUT: '{{.OUTPUT | default "build/tool-fixtures"}}'
      MANIFEST: '{{.MANIFEST | default "build/tool-fixtures/manifest.json"}}'
    dir: backend
    cmds:
      - go run ./cmd/tool-fixtures -release "{{.RELEASE}}" -output "{{if isAbs .OUTPUT}}{{.OUTPUT}}{{else}}{{joinPath .ROOT_DIR .OUTPUT}}{{end}}" -manifest "{{if isAbs .MANIFEST}}{{.MANIFEST}}{{else}}{{joinPath .ROOT_DIR .MANIFEST}}{{end}}"

  fixtures:managed-transport:
    desc: Manual online acceptance (not an automated CI gate) - provision the fixture over the network then run managed-transport-tagged tools tests against its manifest
    deps: [fixtures:provision]
    vars:
      MANIFEST: '{{.MANIFEST | default "build/tool-fixtures/manifest.json"}}'
    dir: backend
    cmds:
      - go test -tags=managed_transport ./internal/integrations/tools -args -managed-manifest "{{if isAbs .MANIFEST}}{{.MANIFEST}}{{else}}{{joinPath .ROOT_DIR .MANIFEST}}{{end}}"

  verify:
    desc: Run generation, linting, tests, and build
    cmds:
      - task: generate
      - node tools/check-generated.mjs
      - task: lint
      - task: test
      - task: design:check
      - task: build
