name: music-enrichment-test-stand

services:
  postgres:
    image: postgres:17
    container_name: music-enrichment-postgres
    environment:
      POSTGRES_DB: music_ingest
      POSTGRES_PASSWORD: music_ingest
      POSTGRES_USER: music_ingest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_ingest -d music_ingest"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  music-ingest:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: music-enrichment-ingest
    command: ["python", "-m", "music_ingest", "serve"]
    environment:
      MUSIC_INGEST_DATABASE_URL: postgresql+psycopg://music_ingest:music_ingest@postgres/music_ingest
      MUSIC_INGEST_SOURCE_ROOTS_PARENT: /data/sources
      MUSIC_INGEST_INCOMING_ROOT: /data/sources/legacy
      MUSIC_INGEST_E2E_SEED_ENABLED: "true"
      MUSIC_INGEST_STAGING_ROOT: /data/media/.staging
      MUSIC_INGEST_MEDIA_ROOT: /data/media
      MUSIC_INGEST_STORAGE_BROWSE_ROOTS: /data
      MUSIC_INGEST_ENABLE_LIVE_TRANSPORT: ${MUSIC_INGEST_ENABLE_LIVE_TRANSPORT:-0}
      MUSIC_INGEST_ACOUSTID_CLIENT_KEY: ${MUSIC_INGEST_ACOUSTID_CLIENT_KEY:-}
      MUSIC_INGEST_MUSICBRAINZ_USER_AGENT: ${MUSIC_INGEST_MUSICBRAINZ_USER_AGENT:-music-ingest/0.1.0 (music-ingest@example.com)}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8000"
    volumes:
      - ./data/sources:/data/sources:ro
      - ./data/media:/data/media
      - ./data/incoming:/data/incoming
      - ./appdata/music-ingest:/appdata/music-ingest
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: music-enrichment-lidarr
    environment:
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      TZ: ${TZ:-Europe/Moscow}
      UMASK: "022"
    ports:
      - "8686:8686"
    volumes:
      - ./config/lidarr:/config
      - ./data/downloads:/data/downloads
      - ./data/media:/data/media
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8686/ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: music-enrichment-navidrome
    environment:
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_MUSICFOLDER: /music
      ND_SCANNER_PURGEMISSING: full
    ports:
      - "4533:4533"
    volumes:
      - ./config/navidrome:/data
      - ./data/media:/music:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:4533/ping"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  lidarr-webhook:
    image: curlimages/curl:8.15.0
    command: ["/bin/sh", "/configure-lidarr-webhook.sh"]
    depends_on:
      lidarr:
        condition: service_healthy
      music-ingest:
        condition: service_healthy
    environment:
      LIDARR_URL: http://lidarr:8686
      WEBHOOK_URL: http://music-ingest:8000/api/intake/lidarr
    volumes:
      - ./config/lidarr:/config:ro
      - ./scripts/configure-lidarr-webhook.sh:/configure-lidarr-webhook.sh:ro
    restart: "no"

networks:
  default:
    enable_ipv6: true

volumes:
  postgres-data:
