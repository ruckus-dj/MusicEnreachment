name: melotrove-go-test-stand

services:
  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://melotrove:melotrove@postgres:5432/melotrove?sslmode=disable
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - type: bind
        source: ./data/downloads/music
        target: /data/sources/music
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/media-go
        target: /var/lib/melotrove/output
      - tools-data:/var/lib/melotrove/tools
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: melotrove
      POSTGRES_USER: melotrove
      POSTGRES_PASSWORD: melotrove
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melotrove -d melotrove"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    environment:
      ND_DATAFOLDER: /data
      ND_MUSICFOLDER: /music
    ports:
      - "127.0.0.1:4533:4533"
    volumes:
      - ./config/navidrome-go:/data
      - ./data/media-go:/music:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4533/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    environment:
      SERVER_NAME: stand
      SERVER_TYPE: navidrome
      SERVER_LOCK: "true"
      SERVER_URL: http://127.0.0.1:4533
      REMOTE_URL: http://127.0.0.1:4533
      LEGACY_AUTHENTICATION: "false"
      ANALYTICS_DISABLED: "true"
    ports:
      - "127.0.0.1:9180:9180"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9180/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      navidrome:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  tools-data:
