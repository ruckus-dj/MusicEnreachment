services:
  music-ingest:
    image: '${MUSIC_INGEST_IMAGE:?MUSIC_INGEST_IMAGE must be set by Komodo to a digest-pinned GHCR image}'
    command: ["python", "-m", "music_ingest", "serve"]
    environment:
      FPCALC: /usr/bin/fpcalc
      MUSIC_INGEST_DATABASE_URL: infisical://music-ingest/database-url
      MUSIC_INGEST_INCOMING_ROOT: /data/incoming
      MUSIC_INGEST_STAGING_ROOT: /appdata/music-ingest/staging
      MUSIC_INGEST_MEDIA_ROOT: /data/publish/music
    expose:
      - "8000"
    volumes:
      - /mnt/ssd/appdata/music-ingest:/appdata/music-ingest
      - /mnt/pool/data/media:/data/publish/music
      - /mnt/pool/data/music-incoming:/data/incoming:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
